# Labels that the Labeler workflow (.github/workflows/labeler.yaml) adds to a
# new pull request. They choose the section of the pull request in the
# release notes (.github/release.yaml). The branch prefixes are the ones in
# CONTRIBUTING.md. Each label must exist in the repository: the workflow may
# add labels, but not create them.
#
# head-branch takes regular expressions, changed-files takes globs.
# Docs: https://github.com/actions/labeler

enhancement:
  - head-branch: ['^feat/', '^feature/']

bug:
  - head-branch: ['^fix/', '^bugfix/', '^hotfix/']

# A docs/ branch, or any branch whose pull request only changes Markdown
# files.
documentation:
  - any:
      - head-branch: ['^docs/']
      - changed-files:
          - any-glob-to-all-files: '**/*.md'
