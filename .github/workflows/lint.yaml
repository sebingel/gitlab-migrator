name: Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # golangci-lint stops if it was built with an older Go than the
      # toolchain line of go.mod. When the Go toolchain workflow proposes a
      # new minor Go release, this version may have to go up in the same pull
      # request. The golangci-lint changelog says which release supports
      # which Go version (see CONTRIBUTING.md).
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
