name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@833fb0f8c9f6686b33d963a8bae0a94f4936ab2a # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Built-in /code-review command at xhigh effort. --comment posts the findings
          # on the PR. Sources: https://code.claude.com/docs/en/commands and
          # https://code.claude.com/docs/en/github-actions#run-a-skill
          prompt: '/code-review xhigh --comment ${{ github.event.pull_request.number }}'
          # The inline comment tool is only started when it is named in --allowedTools.
          # The model is set explicitly so that xhigh effort always runs on Opus.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action hides Claude's output and can report success although no
      # model request succeeded (issue #43: every review run from July to
      # September 2026 reported total_cost_usd 0, and nothing was posted).
      # This step prints the facts of the result, and it fails the job when
      # the result reports no model usage. It is skipped when the action did
      # not start Claude, for example on a PR that changes this workflow file.
      - name: Check the result of the review
        if: ${{ !cancelled() && (steps.claude-review.outputs.execution_file != '' || steps.claude-review.outputs.conclusion != '') }}
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
        run: |
          trap 'echo "::error title=Claude review check failed::The check stopped with an error, see the lines above."' ERR
          if [ -z "$EXECUTION_FILE" ]; then
            echo "::error title=Claude review wrote no output::The action reported conclusion '$CONCLUSION' but wrote no execution file."
            exit 1
          fi
          # One jq call checks the result against the Agent SDK types and reads
          # the fields. It stops with an error when there is no result message
          # or a field has an unexpected type. The fields are joined with the
          # unit separator, so an empty field keeps its place.
          fields=$(jq -r '
            ([.[] | select(.type == "assistant")] | length) as $assistant
            | ([.[] | select(.type == "system" and .subtype == "local_command_output")] | length) as $local
            | [.[] | select(.type == "result")] | last
            | if . == null then error("the execution file has no result message")
              elif (.subtype | type) != "string" or (.is_error | type) != "boolean"
                or (.modelUsage | type) != "object" or (.permission_denials | type) != "array"
                or ([.modelUsage[] | .inputTokens, .outputTokens, .cacheReadInputTokens, .cacheCreationInputTokens | type] | all(. == "number") | not)
              then error("unexpected result format: the result does not match the Agent SDK types")
              else [
                # modelUsage counts every model request of the run, also those
                # of subagents, which /code-review uses. An entry without
                # tokens is not a successful request.
                ([.modelUsage[] | .inputTokens + .outputTokens + .cacheReadInputTokens + .cacheCreationInputTokens > 0] | any),
                "subtype=\(.subtype) is_error=\(.is_error) num_turns=\(.num_turns) duration_ms=\(.duration_ms) api_error_status=\(.api_error_status) terminal_reason=\(.terminal_reason) assistant_messages=\($assistant) local_command_outputs=\($local)",
                ([.permission_denials[].tool_name] | unique | join(", "))
              ] | map(tostring) | join("\u001f")
              end' "$EXECUTION_FILE")
          IFS=$'\x1f' read -r reached_model facts denied <<<"$fields"
          echo "Result: $facts"
          if [ -n "$denied" ]; then
            echo "::warning title=Claude review tool denials::Claude was not allowed to use: $denied"
          fi
          # When the model was reached, the result text may hold model output.
          # It is never printed then, because the logs of this public
          # repository must not show model output. A run that reached the
          # model and ended with an error already fails the action step, and
          # the facts above show why.
          if [ "$reached_model" != "true" ]; then
            # modelUsage leaves out only helper calls such as the permission
            # classifier, which never write the result. So without model
            # usage the text comes from Claude Code and not from the model.
            text=$(jq -r '
              [.[] | select(.type == "result")] | last
              | if .subtype == "success" then .result
                elif (.errors | type) == "array" then .errors | join("; ")
                else error("unexpected result format: errors is missing") end' "$EXECUTION_FILE")
            # Print the text with workflow commands off, so it cannot inject any.
            token=$(openssl rand -hex 16)
            echo "::stop-commands::$token"
            printf '%s\n' "${text:0:2000}"
            echo "::$token::"
            echo "::error title=Claude review reported no model usage::The result reports no model usage, so no review was made. If the text above shows an authentication or billing error, replace the ANTHROPIC_API_KEY secret."
            exit 1
          fi
