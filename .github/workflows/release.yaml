name: Release

# Every push to main (a merged pull request) creates a GitHub release with
# binaries for all platforms. Pull requests run the same build as a dry run
# and publish nothing. CONTRIBUTING.md explains the version labels.
#
# Build and publish happen in this one run on purpose. A tag or release that
# is created with GITHUB_TOKEN does not start other workflows, so a separate
# workflow that listens for new tags would never run.

on:
  push:
    branches:
      - main
    # A push that changes only these files creates no release. The next
    # release picks the changes up.
    paths-ignore:
      - '**.md'
      - '**.jpeg'
  pull_request:
    # labeled and unlabeled update the version preview of the dry run.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to increase
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

# Releases run one after another, and a running release is never cancelled,
# so two merges close together cannot get the same version. Limit: GitHub
# keeps only one waiting run per group. If a third release run starts while
# one runs and one waits, the waiting run is cancelled. If the newest run
# creates a release, it includes all changes, but it uses only the labels of
# its own pull request. If the newest run creates no release (for example
# release:skip), the changes of the cancelled run stay unreleased until the
# next release. "queue: max" would fix this, but actionlint does not support
# it yet.
# A new dry run of a pull request cancels the older dry run of the same
# pull request.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-dry-run-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # read the labels of the merged pull request
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      build_version: ${{ steps.plan.outputs.build_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags, to find the latest version
          persist-credentials: false

      - name: Test the version logic
        run: bash .github/scripts/release-plan_test.sh

      - name: Compute version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          case "$EVENT_NAME" in
            push)
              MESSAGE="$(git log -1 --format=%B "$GITHUB_SHA")"
              # The API can lag a few seconds behind a fresh merge, so ask
              # more than once before we treat the push as a direct push.
              # In a fork the API also lists pull requests of the parent
              # repository, so keep only the ones merged into our main.
              prs="[]"
              for attempt in 1 2 3 4 5; do
                prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
                  jq --arg repo "$GITHUB_REPOSITORY" \
                    '[.[] | select(.merged_at != null and .base.repo.full_name == $repo and .base.ref == "main")]')"
                if [ "$(jq length <<< "$prs")" -gt 0 ]; then
                  break
                fi
                if [ "$attempt" -lt 5 ]; then
                  sleep 10
                fi
              done
              if [ "$(jq length <<< "$prs")" -gt 0 ]; then
                echo "Pull request(s): $(jq -r 'map("#\(.number)") | join(", ")' <<< "$prs")"
              elif grep -qE '^Merge pull request #[0-9]+ from |\(#[0-9]+\)$' <<< "${MESSAGE%%$'\n'*}"; then
                # A merge or squash commit made by GitHub. Without its labels
                # we could release a skipped change or use the wrong bump.
                echo "::error::$GITHUB_SHA looks like a pull request merge, but the API returns no merged pull request for it. Run the failed jobs again later."
                exit 1
              else
                echo "::warning::$GITHUB_SHA is a direct push without a pull request, so no labels apply."
              fi
              LABELS="$(jq -r '.[].labels[].name' <<< "$prs")"
              export LABELS MESSAGE
              ;;
            pull_request)
              LABELS="$(jq -r '.[]' <<< "$PR_LABELS")"
              MESSAGE="$PR_TITLE"
              export LABELS MESSAGE
              ;;
            workflow_dispatch)
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "::error::Manual releases are only allowed from main, not from $GITHUB_REF."
                exit 1
              fi
              export BUMP="$INPUT_BUMP"
              ;;
            *)
              echo "::error::Unexpected event $EVENT_NAME."
              exit 1
              ;;
          esac

          TAGS="$(git tag --list 'v*')"
          export TAGS
          plan="$(bash .github/scripts/release-plan.sh)"
          echo "$plan"

          value() { sed -n "s/^$1=//p" <<< "$plan"; }

          # "Re-run all jobs" on an old run keeps the old commit, but sees
          # the new tags. Never release a commit that is older than the
          # previous release.
          previous="$(value previous)"
          if [ "$EVENT_NAME" != "pull_request" ] && [ -n "$previous" ] &&
            ! git merge-base --is-ancestor "$previous" "$GITHUB_SHA"; then
            echo "::error::$GITHUB_SHA does not contain the previous release $previous. An old run was probably started again. Use a manual release on main instead."
            exit 1
          fi

          version="$(value version)"
          publish=false
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$(value release)" = "true" ]; then
            publish=true
          fi
          build_version="$version"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            build_version="$version-dryrun.${GITHUB_SHA:0:7}"
          fi

          {
            echo "$plan"
            echo "publish=$publish"
            echo "build_version=$build_version"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release plan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Event | \`$EVENT_NAME\` |"
            echo "| Previous version | \`$(value previous)\` |"
            echo "| Bump | \`$(value bump)\` |"
            echo "| Next version | \`$version\` |"
            echo "| Release | \`$(value release)\` ($(value reason)) |"
            echo "| Publish in this run | \`$publish\` |"
            echo "| Version in the binaries | \`$build_version\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build release assets
    needs: plan
    if: needs.plan.outputs.publish == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no shared cache in a release build

      - name: Build
        env:
          VERSION: ${{ needs.plan.outputs.build_version }}
        run: bash .github/scripts/build-release.sh "$VERSION" dist

      - name: Check the archives
        working-directory: dist
        run: |
          for archive in *.tar.gz; do
            mode="$(tar -tvzf "$archive" gitlab-migrator | cut -c1-10)"
            if [ "$mode" != "-rwxr-xr-x" ]; then
              echo "::error::$archive: gitlab-migrator has mode $mode, expected -rwxr-xr-x."
              exit 1
            fi
          done
          for archive in *.zip; do
            unzip -l "$archive" gitlab-migrator.exe
          done
          sha256sum --check --strict -- *_checksums.txt

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check --strict -- *_checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          # "Re-run failed jobs" reuses the old plan. If another release
          # was made since then, this run would publish older code as the
          # latest release, so stop.
          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          highest="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")' |
            { grep -E "$semver_re" || true; } | sort -V | tail -n 1)"
          if [ "$highest" != "$PREVIOUS" ]; then
            echo "::error::This run was planned after '$PREVIOUS', but the latest tag is now '$highest'. Start a manual release on main instead."
            exit 1
          fi

          # Never reuse or move a tag that already exists.
          status=0
          answer="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" 2>&1)" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Tag $VERSION already exists."
            exit 1
          fi
          if ! grep -q "HTTP 404" <<< "$answer"; then
            echo "::error::Could not check if tag $VERSION exists: $answer"
            exit 1
          fi

          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes --latest)
          if [ -n "$PREVIOUS" ]; then
            args+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$VERSION" "${args[@]}" dist/*


