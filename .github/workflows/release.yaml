name: Release

# A push to main that changes the binaries or the release assets (see paths
# below) creates a GitHub release with binaries for all platforms, unless the
# merged pull request has the label release:skip. Pull requests run the same
# build as a dry run and publish nothing. CONTRIBUTING.md explains the rules.
#
# Build and publish happen in this one run on purpose. A tag or release that
# is created with GITHUB_TOKEN does not start other workflows, so a separate
# workflow that listens for new tags would never run.

on:
  push:
    branches:
      - main
    # Only a push that changes one of these files creates a release. They are
    # the inputs of the binaries (Go code without tests, go.mod with the Go
    # version, go.sum) and of the archives (build-release.sh and LICENSE).
    # README.md is in the archives too, but documentation edits alone do not
    # need a new version; the next release ships the current README.md.
    # Workflow changes (for example Dependabot action updates) do not change
    # the assets either. The code has no go:embed files.
    paths:
      - '**.go'
      - '!**_test.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/scripts/build-release.sh'
      - 'LICENSE'
  pull_request:
    # labeled and unlabeled update the version preview of the dry run.
    # edited checks a new title for GitHub skip markers.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to increase
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

# Only runs that can release (push and manual runs on main) share the group
# "release". They run one after another, and "queue: max" lets up to 100 of
# them wait instead of cancelling the waiting one. So normally every merge
# gets its own release decision with its own labels, and two merges close
# together cannot get the same version. GitHub does not guarantee the order
# of waiting runs. If a newer merge is released first, the run of the older
# merge fails in the plan job (its commit does not contain the new release),
# its changes are already in the newer release, and its labels do not count.
# Every other run (dry runs of pull requests, manual runs on other branches)
# gets a group of its own, so it never waits for another run and never takes
# a place in the release queue. GitHub does not allow "queue: max" together
# with cancel-in-progress, so an older dry run is not cancelled. It runs to
# the end in parallel with the newer one.
# actionlint 1.7.12 does not know "queue" yet, see .github/actionlint.yaml.
concurrency:
  group: >-
    ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'release'
    || format('release-{0}-{1}', github.event_name, github.run_id) }}
  queue: max

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan release
    # A label change on a closed or merged pull request starts this workflow
    # too. Its merge ref is stale, so there is nothing to check.
    if: github.event_name != 'pull_request' || github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # read the labels of the merged pull request
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      build_version: ${{ steps.plan.outputs.build_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags, to find the latest version
          persist-credentials: false

      - name: Test the version logic
        run: bash .github/scripts/release-plan_test.sh

      # This step only collects facts. release-plan.sh makes every decision
      # and release-plan_test.sh tests them.
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BUMP: ${{ inputs.bump }}
        run: |
          TAGS="$(git tag --list 'v*')"
          MERGED_TAGS="$(git tag --list 'v*' --merged "$SHA")"
          SHA_TAGS="$(git tag --list 'v*' --points-at "$SHA")"
          COMMIT_MESSAGE="$(git log -1 --format=%B "$SHA")"
          PR_COMMIT_MESSAGES=""
          if [ "$EVENT" = "pull_request" ]; then
            # SHA is the merge ref: base as first, pull request head as second parent.
            PR_COMMIT_MESSAGES="$(git log --format='@@@ %h%n%B' "$SHA^1..$SHA^2")"
          fi
          export TAGS MERGED_TAGS SHA_TAGS COMMIT_MESSAGE PR_COMMIT_MESSAGES
          RESULT_FILE="$GITHUB_OUTPUT" SUMMARY_FILE="$GITHUB_STEP_SUMMARY" \
            bash .github/scripts/release-plan.sh plan

  build:
    name: Build release assets
    needs: plan
    if: needs.plan.outputs.publish == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Dry runs use the Go cache, so a label change does not rebuild
          # everything from scratch. A real release never uses a cache.
          cache: ${{ github.event_name == 'pull_request' }}
          # The other workflows save a cache under the go.sum key first, and
          # setup-go does not save again after a hit, so the cross compiled
          # packages would never be cached. build-release.sh in the key gives
          # the dry runs a cache of their own.
          cache-dependency-path: |
            go.sum
            .github/scripts/build-release.sh

      - name: Build
        env:
          VERSION: ${{ needs.plan.outputs.build_version }}
        run: bash .github/scripts/build-release.sh "$VERSION" dist

      - name: Check the archives
        working-directory: dist
        run: |
          for archive in *.tar.gz; do
            mode="$(tar -tvzf "$archive" gitlab-migrator | cut -c1-10)"
            if [ "$mode" != "-rwxr-xr-x" ]; then
              echo "::error::$archive: gitlab-migrator has mode $mode, expected -rwxr-xr-x."
              exit 1
            fi
          done
          for archive in *.zip; do
            unzip -l "$archive" gitlab-migrator.exe
          done
          sha256sum --check --strict -- *_checksums.txt

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          # "Re-run failed jobs" of a release needs this artifact. GitHub
          # allows re-runs for 30 days, so keep it that long.
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  publish:
    name: Publish release
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release

    steps:
      # Only the scripts, but all tags, for the check below.
      - name: Checkout scripts and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check --strict -- *_checksums.txt

      # "Re-run failed jobs" reuses the old plan. Stop if another release was
      # made since then, or if the tag exists. It never moves or reuses a tag.
      - name: Check that the plan is still current
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          TAGS="$(git tag --list 'v*')"
          export TAGS
          bash .github/scripts/release-plan.sh verify

      # --generate-notes lists the pull requests that were merged since
      # PREVIOUS, sorted into the sections of .github/release.yaml.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes --latest)
          if [ -n "$PREVIOUS" ]; then
            args+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$VERSION" "${args[@]}" dist/*
