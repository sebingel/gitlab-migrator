name: Release

# Every push to main (a merged pull request) creates a GitHub release with
# binaries for all platforms. Pull requests run the same build as a dry run
# and publish nothing. CONTRIBUTING.md explains the version labels.
#
# Build and publish happen in this one run on purpose. A tag or release that
# is created with GITHUB_TOKEN does not start other workflows, so a separate
# workflow that listens for new tags would never run.

on:
  push:
    branches:
      - main
    # A push that changes only these files creates no release. The next
    # release picks the changes up.
    paths-ignore:
      - '**.md'
      - '**.jpeg'
  pull_request:
    # labeled and unlabeled update the version preview of the dry run.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to increase
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

# Only runs that can release (push and manual runs on main) share the group
# "release". They run one after another, and a running release is never
# cancelled, so two merges close together cannot get the same version.
# Limit: GitHub keeps only one waiting run per group. If a third release run
# starts while one runs and one waits, the waiting run is cancelled. If the
# newest run creates a release, it includes all changes, but it uses only the
# labels of its own pull request. If the newest run creates no release (for
# example release:skip), the changes of the cancelled run stay unreleased
# until the next release. "queue: max" would fix this, but actionlint does
# not support it yet.
# A manual run on another branch gets its own group, so it cannot take the
# waiting place of a real release. It fails in the plan job.
# A new dry run of a pull request cancels the older dry run of the same pull
# request.
concurrency:
  group: >-
    ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'release'
    || format('release-{0}-{1}', github.event_name, github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan release
    # A label change on a closed or merged pull request starts this workflow
    # too. Its merge ref is stale, so there is nothing to check.
    if: github.event_name != 'pull_request' || github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # read the labels of the merged pull request
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      build_version: ${{ steps.plan.outputs.build_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags, to find the latest version
          persist-credentials: false

      - name: Test the version logic
        run: bash .github/scripts/release-plan_test.sh

      # This step only collects facts. release-plan.sh makes every decision
      # and release-plan_test.sh tests them.
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BUMP: ${{ inputs.bump }}
        run: |
          TAGS="$(git tag --list 'v*')"
          MERGED_TAGS="$(git tag --list 'v*' --merged "$SHA")"
          SHA_TAGS="$(git tag --list 'v*' --points-at "$SHA")"
          COMMIT_MESSAGE="$(git log -1 --format=%B "$SHA")"
          export TAGS MERGED_TAGS SHA_TAGS COMMIT_MESSAGE
          RESULT_FILE="$GITHUB_OUTPUT" SUMMARY_FILE="$GITHUB_STEP_SUMMARY" \
            bash .github/scripts/release-plan.sh plan

  build:
    name: Build release assets
    needs: plan
    if: needs.plan.outputs.publish == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Dry runs use the Go cache, so a label change does not rebuild
          # everything from scratch. A real release never uses a cache.
          cache: ${{ github.event_name == 'pull_request' }}

      - name: Build
        env:
          VERSION: ${{ needs.plan.outputs.build_version }}
        run: bash .github/scripts/build-release.sh "$VERSION" dist

      - name: Check the archives
        working-directory: dist
        run: |
          for archive in *.tar.gz; do
            mode="$(tar -tvzf "$archive" gitlab-migrator | cut -c1-10)"
            if [ "$mode" != "-rwxr-xr-x" ]; then
              echo "::error::$archive: gitlab-migrator has mode $mode, expected -rwxr-xr-x."
              exit 1
            fi
          done
          for archive in *.zip; do
            unzip -l "$archive" gitlab-migrator.exe
          done
          sha256sum --check --strict -- *_checksums.txt

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          # "Re-run failed jobs" of a release needs this artifact, so keep it
          # as long as the repository allows (90 days).
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}

  publish:
    name: Publish release
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release

    steps:
      # Only the scripts, but all tags, for the check below.
      - name: Checkout scripts and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check --strict -- *_checksums.txt

      # "Re-run failed jobs" reuses the old plan. Stop if another release was
      # made since then, or if the tag exists. It never moves or reuses a tag.
      - name: Check that the plan is still current
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          TAGS="$(git tag --list 'v*')"
          export TAGS
          bash .github/scripts/release-plan.sh verify

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes --latest)
          if [ -n "$PREVIOUS" ]; then
            args+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$VERSION" "${args[@]}" dist/*


